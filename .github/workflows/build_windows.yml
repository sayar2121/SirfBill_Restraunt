name: Build SirfBill Restaurant Windows Release and Auto-Updater

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v1.0.18

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (for updater)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Create .env File
        shell: pwsh
        run: |
          Set-Content -Path ".env" -Value "API_BASE_URL=http://192.168.0.159:8000"

      - name: Pre-fetch PDFium Binaries
        shell: pwsh
        continue-on-error: true
        run: |
          $destDir = "build/windows/x64/pdfium-download/pdfium-download-prefix/src"
          New-Item -ItemType Directory -Force -Path $destDir
          $pdfiumUrl = "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/5200/pdfium-win-x64.tgz"
          $destFile = Join-Path $destDir "pdfium-win-x64.tgz"
          Write-Host "Pre-downloading PDFium from $pdfiumUrl..."
          curl.exe -fSL --retry 10 --retry-delay 5 $pdfiumUrl -o $destFile
          if (Test-Path $destFile) {
            Write-Host "PDFium pre-downloaded successfully: $((Get-Item $destFile).Length) bytes"
          } else {
            Write-Warning "Could not pre-download PDFium; CMake will attempt download during build."
          }

      - name: Build Flutter Windows App (Release)
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          if (-not $tagName -or $tagName -eq "main" -or $tagName -eq "master") {
            $pubspec = Get-Content "pubspec.yaml" -Raw
            if ($pubspec -match "version:\s*([^\+\s]+)") {
              $tagName = "v" + $matches[1]
            } else {
              $tagName = "${{ env.RELEASE_TAG }}"
            }
          }
          $cleanVersion = $tagName.TrimStart('v')
          echo "RESOLVED_TAG=$tagName" >> $env:GITHUB_ENV
          flutter build windows --release --build-name=$cleanVersion --build-number=1

      - name: Copy .env into Flutter Release Directory
        shell: pwsh
        run: |
          Copy-Item -Path ".env" -Destination "build/windows/x64/runner/Release/.env" -Force

      - name: Build Standalone Updater (.NET 8)
        run: |
          dotnet publish updater/Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o updater/publish

      - name: Copy Updater into Flutter Release Directory
        shell: pwsh
        run: |
          Copy-Item -Path "updater/publish/updater.exe" -Destination "build/windows/x64/runner/Release/updater.exe" -Force

      - name: Create Zip Package for In-App Auto-Update (app-update.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "app-update.zip" -Force
          $hash = (Get-FileHash -Path "app-update.zip" -Algorithm SHA256).Hash.ToLower()
          echo "SHA256=$hash" >> $env:GITHUB_ENV
          echo "Package SHA256: $hash"

      - name: Update Version in Inno Setup Script
        shell: pwsh
        run: |
          $tagName = "$env:RESOLVED_TAG"
          if (-not $tagName) {
            $tagName = "${{ env.RELEASE_TAG }}"
          }
          $cleanVersion = $tagName.TrimStart('v')
          (Get-Content "installer/setup.iss") -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$cleanVersion`"" | Set-Content "installer/setup.iss"
          Write-Host "Inno Setup MyAppVersion updated to: $cleanVersion"

      - name: Build Inno Setup Installer (.exe)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/setup.iss

      - name: Rename & Prepare Artifacts
        shell: pwsh
        run: |
          $tagName = "$env:RESOLVED_TAG"
          if (-not $tagName) {
            $tagName = "${{ env.RELEASE_TAG }}"
          }
          $cleanVersion = $tagName.TrimStart('v')
          echo "RELEASE_TAG=$tagName" >> $env:GITHUB_ENV

          # Generate manifest.json with rich release notes
          $manifestContent = @"
          {
            "product_id": "sirfbill-restaurant-windows",
            "platform": "windows-x64",
            "channel": "stable",
            "version": "$cleanVersion",
            "mandatory": false,
            "release_notes": "• [TABLE RESERVATION] Tables strictly remain occupied while food is served and only release to available upon payment settlement\n• [UI COLOR CODING] Table selection chips dynamically color code: red for occupied, amber for reserved, green for empty\n• [KDS AUDIO & LOGO] Muted POS KDS audio and isolated standalone KDS logo header\n• [UPDATER] Diagnostic logging, accurate process termination and safe fallback recovery",
            "package_url": "https://github.com/${{ github.repository }}/releases/download/$tagName/Sirfbill_Restaurant_Setup.exe",
            "sha256": "$env:SHA256"
          }
          "@
          Set-Content -Path "manifest.json" -Value $manifestContent

          # Rename Setup installer to include tag
          $installer = Get-ChildItem -Path "installer_output" -Filter "*.exe" | Select-Object -First 1
          if ($installer) {
            Move-Item -Path $installer.FullName -Destination "Sirfbill_Restaurant_Setup.exe" -Force
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            Sirfbill_Restaurant_Setup.exe
            app-update.zip
            manifest.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
